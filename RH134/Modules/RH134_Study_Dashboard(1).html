<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH134 RHEL 10 Study Dashboard</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#0f0f12;color:#e5e7eb;margin:0;padding:20px}
.container{max-width:1100px;margin:auto}
h1{font-size:2rem;background:linear-gradient(90deg,#ff1a1a,#ff8a00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:#17171c;border:1px solid #2a2a32;border-radius:16px;padding:16px;margin:12px 0}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:0.75rem;margin-right:6px}
.critical{background:#ff1a1a22;color:#ff6b6b;border:1px solid #ff1a1a55}
.high{background:#ff8a0022;color:#ffb86a;border:1px solid #ff8a0055}
.med{background:#3b82f622;color:#93c5fd;border:1px solid #3b82f655}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.check{list-style:none;padding:0}
.check li{padding:6px 8px;border-radius:8px;margin:4px 0;background:#1f1f26;display:flex;gap:8px;align-items:flex-start}
.check li input{margin-top:4px}
.progress{height:8px;background:#2a2a32;border-radius:4px;overflow:hidden;margin:10px 0}
.progress div{height:100%;background:linear-gradient(90deg,#ff1a1a,#ff8a00);width:0%;transition:width .3s}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{background:#ff1a1a;color:white;border:none;padding:8px 14px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
<h1>🚀 RH134 RHEL 10.0 - Study Dashboard</h1>
<p>19 Modules • 685 Pages • 6-Week Plan • Based on your SA-2 PDF (Aug 2025 Edition)</p>

<div class="card">
<h3>📊 Overall Progress <span id="overallText">0%</span></h3>
<div class="progress"><div id="overallBar"></div></div>
<button class="btn" onclick="save()">Export Checklist for Obsidian</button>
<span style="font-size:0.8rem;opacity:.7;margin-left:8px">Checkboxes auto-save</span>
</div>

<div class="grid" id="grid"></div>

</div>
<script>
const modules = [
{ id:1, title:"Shell Scripting & Command Line", diff:"High", topics:["Shell variables vs Environment (export, PATH, alias, bashrc, PS1)","Simple bash scripts (shebang, chmod +x, $0 $1 ${10} $#)","Quoting \\ ' \" , command substitution","Loops & Conditionals (for, while, if, case, [[ ]], && ||)","Lab: backup & user creation scripts"], hours:6},
{ id:2, title:"Regular Expressions", diff:"Medium", topics:["Basic vs Extended regex ^ $ . [] * + ? {} () |","grep, grep -E, grep -v -i -r, sed, awk basics","Globbing vs Regex"], hours:3},
{ id:3, title:"Scheduling User Tasks", diff:"High", topics:["at, atq, atrm, batch, time syntax, /etc/at.allow","User crontab crontab -e -l -r, format * * * * *","@reboot @daily specials"], hours:3},
{ id:4, title:"Scheduling System Tasks", diff:"High", topics:["Systemd timers: .service + .timer, OnCalendar, list-timers","systemd-tmpfiles /etc/tmpfiles.d/ syntax d r z","System cron /etc/crontab /etc/cron.hourly anacron"], hours:5},
{ id:5, title:"Analyzing and Storing Logs", diff:"High", topics:["Syslog architecture rsyslog vs journald","/var/log/messages secure maillog, logger, logrotate","journalctl -b -u -p -f --since -o verbose","Persistent journal Storage=persistent","chrony chronyd chronyc, timedatectl"], hours:7},
{ id:6, title:"Managing Security with SELinux", diff:"Critical", topics:["Modes Enforcing Permissive Disabled getenforce setenforce","Contexts user:role:type:level ls -Z ps -Z","semanage fcontext restorecon chcon difference","Booleans getsebool setsebool -P","Troubleshooting audit2why sealert audit2allow semodule"], hours:8},
{ id:7, title:"Archiving Files", diff:"Low", topics:["tar cf tf xf czf xzf cJf cjf tvf --exclude preserve","gzip bzip2 xz compression"], hours:2},
{ id:8, title:"Transferring Files", diff:"Medium", topics:["scp -r scp pull/push sftp put get","rsync -av --delete -e ssh --dry-run"], hours:3},
{ id:9, title:"Tuning System Performance", diff:"Medium", topics:["tuned tuned-adm list active profile recommend","nice renice ps -o ni top"], hours:3},
{ id:10, title:"Managing Basic Storage", diff:"High", topics:["lsblk blkid parted fdisk gdisk mklabel mkpart","mkfs.xfs ext4 mount umount findmnt fstab UUID","Swap mkswap swapon swap file dd + priority"], hours:6},
{ id:11, title:"Managing Storage with LVM", diff:"Critical", topics:["PV VG LV architecture pvcreate vgcreate lvcreate pvs vgs lvs","Extend lvextend -r vgextend xfs_growfs resize2fs","pvmove vgreduce pvremove lvreduce dangers"], hours:7},
{ id:12, title:"Controlling & Troubleshooting Boot", diff:"Critical", topics:["GRUB2 /etc/default/grub grubby --info --args --update-kernel","Boot phases BIOS/UEFI GRUB kernel initramfs systemd","Targets multi-user graphical rescue emergency get-default set-default isolate","Repair fstab fail, xfs_repair fsck, systemd-analyze blame"], hours:6},
{ id:13, title:"Recovering Superuser Access", diff:"Critical", topics:["rd.break method: edit linux line, mount -o remount,rw /sysroot, chroot","passwd root touch /.autorelabel exit reboot"], hours:3},
{ id:14, title:"Managing Network Security", diff:"High", topics:["firewalld zones firewall-cmd --add-service/port --rich-rule --permanent","SELinux port labeling semanage port -a -t http_port_t -p tcp 82 ss -tlnZ"], hours:5},
{ id:15, title:"Accessing Network-attached Storage", diff:"Medium", topics:["NFS server /etc/exports exportfs showmount -e","Client mount NFS _netdev fstab","Autofs auto.master auto.misc direct vs indirect"], hours:4},
{ id:16, title:"Installing RHEL", diff:"Low", topics:["Anaconda interactive stages","Kickstart ks.cfg lang keyboard timezone clearpart part rootpw packages %post","ksvalidator inst.ks= boot param"], hours:4},
{ id:17, title:"Managing Containers with Podman", diff:"High", topics:["Containers vs VMs OCI podman docker buildah","run -d -p -v --name ps logs exec stop rm inspect rootless","Containerfile FROM RUN COPY EXPOSE CMD build tag push","Systemd generate systemd enable-linger user service"], hours:6},
{ id:18, title:"Image-based RHEL (RHEL10 NEW)", diff:"Medium", topics:["bootc concept immutable transactional","bootc-image-builder Containerfile for bootc","bootc status upgrade rollback switch usr read-only"], hours:4},
{ id:19, title:"Comprehensive Review", diff:"Critical", topics:["Lab Boot fix + Maintain","Lab File Systems & Storage (partition+LVM+NFS)","Lab Server Security (SELinux+firewall)","Lab Containers + Timers","Full 4h Mock exam"], hours:8},
];
const grid = document.getElementById('grid');
function render(){
  const saved = JSON.parse(localStorage.getItem('rh134-checks')||'{}');
  grid.innerHTML='';
  let total=0, done=0;
  modules.forEach(m=>{
    let html=`<div class="card"><div class="header"><strong>M${m.id}: ${m.title}</strong> <span class="badge ${m.diff==='Critical'?'critical':m.diff==='High'?'high':'med'}">${m.diff} • ${m.hours}h</span></div><ul class="check">`;
    m.topics.forEach((t,i)=>{
      const key=`${m.id}-${i}`;
      const checked = saved[key] ? 'checked' : '';
      if(checked) done++;
      total++;
      html+=`<li><input type="checkbox" ${checked} onchange="toggle('${key}',this.checked)"/> <span>${t}</span></li>`;
    });
    html+=`</ul></div>`;
    grid.innerHTML+=html;
  });
  const pct = total? Math.round(done/total*100):0;
  document.getElementById('overallBar').style.width=pct+'%';
  document.getElementById('overallText').innerText=pct+'% ('+done+'/'+total+' tasks)';
}
function toggle(k,v){
  const s = JSON.parse(localStorage.getItem('rh134-checks')||'{}');
  s[k]=v;
  localStorage.setItem('rh134-checks',JSON.stringify(s));
  render();
}
function save(){
  const s = localStorage.getItem('rh134-checks');
  const md = modules.map(m=>{
    return `### M${m.id} ${m.title}\n`+m.topics.map((t,i)=>{
      const k=`${m.id}-${i}`;
      const saved = JSON.parse(s||'{}')[k] ? 'x':' ';
      return `- [${saved}] ${t}`;
    }).join('\n');
  }).join('\n\n');
  const blob = new Blob([md],{type:'text/markdown'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RH134_Obsidian_Export.md';a.click();
}
render();
</script>
</body>
</html>
